# Nginx: статика React + прокси /api/* → FastAPI (Uvicorn).
#
# На сервере перед включением:
# 1) API должен слушать на хосте, например http://127.0.0.1:8000
#    В docker-compose у сервиса api:
#      ports:
#        - "127.0.0.1:8000:8000"
#    (уберите публичный "80:8000" с api — порт 80 займёт nginx.)
# 2) Сборка фронта и копирование dist:
#      cd ~/Legal-AI-service/frontend && npm ci && npm run build
#      sudo mkdir -p /var/www/legalai-service
#      sudo rsync -a --delete dist/ /var/www/legalai-service/
# 3) Установка конфига:
#      sudo cp deploy/nginx-legalai-service.conf /etc/nginx/sites-available/legalai-service
#      sudo ln -sf /etc/nginx/sites-available/legalai-service /etc/nginx/sites-enabled/
#      sudo nginx -t && sudo systemctl reload nginx
# 4) CORS в backend/.env (production, JSON-массив):
#      CORS_ORIGINS=["https://legalai-service.ru","https://www.legalai-service.ru"]
#    Для чистого HTTP до certbot добавьте http://... те же хосты.
# 5) HTTPS: certbot --nginx -d legalai-service.ru -d www.legalai-service.ru
#
# Примечание: фронт по умолчанию ходит на /api/... — префикс снимается здесь и
# уходит на бэкенд как /auth/..., /chat/..., /ws/... .

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream legal_ai_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name legalai-service.ru www.legalai-service.ru app.legalai-service.ru;

    root /var/www/legalai-service;
    index index.html;

    # SPA: все маршруты React → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Кэш для статики Vite (имена файлов с хэшем)
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://legal_ai_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # стриминг чата (SSE/fetch stream)
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # На случай запросов без завершающего слэша после /api
    location = /api {
        return 301 /api/;
    }
}
